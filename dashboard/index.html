<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1d1f21">
    <title>thaa@botnet &gt; dashboard</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <div class="terminal">
        <div class="window-bar" aria-hidden="true">
            <div class="window-dots">
                <span class="window-dot red"></span>
                <span class="window-dot yellow"></span>
                <span class="window-dot green"></span>
            </div>
            <span class="window-title">thaa@botnet: ~</span>
            <span class="window-spacer"></span>
        </div>

        <header class="terminal-header">
            <p class="command"><span class="prompt">thaa@botnet &gt;</span> <span id="current-command">neofetch</span><span class="cursor" aria-hidden="true"></span></p>
            <div class="api-state" id="api-state" role="status">
                <span class="state-dot" aria-hidden="true"></span>
                <span id="api-state-label">connecting</span>
            </div>
        </header>

        <nav class="nav" aria-label="Dashboard pages">
            <a href="#/overview" data-route="overview">overview</a>
            <a href="#/radar" data-route="radar">radar</a>
            <a href="#/devices" data-route="devices">devices</a>
            <a href="#/alerts" data-route="alerts">alerts</a>
            <a href="#/settings" data-route="settings">settings</a>
        </nav>

        <main id="page-content" tabindex="-1">
            <p class="loading">Connecting to the Exorcist API…</p>
        </main>

        <footer class="terminal-footer">
            <span>THAA · HOME NETWORK</span>
            <span id="live-state">WebSocket · waiting</span>
        </footer>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/app.js" defer></script>
</body>
</html>
